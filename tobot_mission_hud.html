    background-size:cover, cover; background-position:center, center;
    background-attachment:fixed, fixed; background-repeat:no-repeat, no-repeat;
  }
  #page{ max-width:1080px; margin:0 auto; padding:18px 16px 40px; position:relative; }

  .banner-wrap{ width:100%; text-align:center; margin-bottom:10px; }
  .banner-wrap img{ width:100%; max-width:900px; height:auto; border-radius:8px; box-shadow:0 8px 30px rgba(63,240,232,0.25); }

  .navtabs{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:12px 0 18px; }
  .navtab{
    padding:9px 20px; border-radius:20px; font-size:13px; font-weight:bold; letter-spacing:2px; text-decoration:none;
    color:var(--dim); background:rgba(255,255,255,0.03); border:1px solid rgba(138,146,201,0.25);
  }
  .navtab.active{ background:rgba(63,240,232,0.16); color:var(--cyan); border-color:rgba(63,240,232,0.5); }
  .navtab:not(.active):hover{ background:rgba(255,255,255,0.06); }

  .panel{
    background:rgba(13,15,34,0.82); border:1px solid var(--panel-edge); border-radius:10px;
    padding:18px; position:relative; box-shadow:0 0 28px rgba(75,47,214,0.18);
    animation:slideIn .6s ease-out both;
  }
  .panel::after{ content:''; position:absolute; right:-1px; bottom:-1px; width:22px; height:22px;
    border-right:2px solid var(--cyan); border-bottom:2px solid var(--cyan); border-radius:0 0 8px 0; }
  @keyframes slideIn{ from{ opacity:0; transform:translateY(24px); } to{ opacity:1; transform:none; } }

  .panel-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  h2{ margin:0; font-size:15px; letter-spacing:3px; color:var(--cyan); }
  .stats{ font-size:12px; letter-spacing:2px; color:var(--dim); }
  .stats b{ color:var(--gold); }

  .badge-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:16px; }
  .badge{
    text-align:center; cursor:pointer; padding:12px 8px 10px; border-radius:10px;
    background:rgba(255,255,255,0.03); border:1px solid rgba(63,240,232,0.18);
    transition:transform .15s, border-color .15s, box-shadow .15s;
    animation:slideIn .5s ease-out both;
  }
  .badge:hover{ transform:translateY(-3px); border-color:rgba(240,168,48,0.7); box-shadow:0 0 18px rgba(240,168,48,0.3); }
  .badge img{ width:100%; height:130px; object-fit:contain; display:block; margin:0 auto 8px;
    filter:drop-shadow(0 0 8px rgba(63,240,232,0.35)); }
  .badge .bn{ font-size:13px; font-weight:bold; color:var(--white); line-height:1.3; }

  .empty{ text-align:center; color:var(--dim); padding:30px 10px; letter-spacing:1px; line-height:1.6; }
  .note{ font-size:12px; color:var(--dim); margin-top:14px; letter-spacing:1px; }

  /* modal */
  #modal{ position:fixed; inset:0; background:rgba(3,3,10,0.82); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
  #modal.open{ display:flex; }
  .modal-box{ width:100%; max-width:420px; background:var(--panel); border:1px solid var(--cyan-dim); border-radius:12px;
    padding:20px; text-align:center; box-shadow:0 0 40px rgba(63,240,232,0.25); position:relative; max-height:92vh; overflow:auto; }
  .modal-box img{ width:auto; max-width:90%; max-height:55vh; height:auto; margin:6px auto 12px; display:block;
    filter:drop-shadow(0 0 16px rgba(63,240,232,0.45)); }
  .modal-box .mn{ font-size:20px; font-weight:bold; color:var(--gold); letter-spacing:1px; }
  .modal-box .md{ font-size:15px; margin-top:8px; line-height:1.5; }
  .modal-box .mt{ font-size:12px; color:var(--dim); margin-top:10px; letter-spacing:2px; }
  .xbtn{ position:absolute; top:8px; right:12px; background:none; border:0; color:var(--dim); font-size:26px; cursor:pointer; }
  .parent-box{ margin-top:16px; border-top:1px solid var(--panel-edge); padding-top:12px; }
  .parent-box input{ width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--panel-edge); background:#080a1a; color:var(--white); font-family:inherit; margin-bottom:8px; }
  .parent-box #delBtn{ padding:9px 16px; border-radius:8px; border:0; background:rgba(224,71,91,0.85); color:#fff; font-family:inherit; font-weight:bold; cursor:pointer; }
  .parent-msg{ font-size:12px; color:var(--dim); margin-top:6px; min-height:14px; }
  .parent-toggle{ background:none; border:0; color:var(--dim); font-family:inherit; font-size:11px; letter-spacing:2px; cursor:pointer; text-decoration:underline; }

  @media (max-width:520px){ .badge-grid{ grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); } .badge img{ height:110px; } }
</style>
</head>

  <div class="panel">
    <div class="panel-head">
      <h2>&#127894; BADGE WALL</h2>
      <div class="stats" id="stats">LOADING...</div>
    </div>
    <div class="badge-grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">No mission badges yet.<br>Finish a Daedo City mission with Tobot to earn one!</div>
    <div class="note" id="note"></div>
  </div>

</div>

<div id="modal">
  <div class="modal-box">
    <button class="xbtn" id="closeModal" aria-label="Close">&times;</button>
    <img id="mImg" alt="Badge">
    <div class="mn" id="mName"></div>
    <div class="md" id="mDesc"></div>
    <div class="mt" id="mDate"></div>
    <div class="parent-box" id="parentBox" style="display:none">
      <button class="parent-toggle" id="parentToggle">PARENT: REMOVE THIS BADGE</button>
      <div id="parentForm" style="display:none; margin-top:10px">
        <input type="password" id="passInput" placeholder="Parent passcode" autocomplete="off">
        <button id="delBtn">Remove badge</button>
        <div class="parent-msg" id="parentMsg"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const DEFAULT_RELAY = 'https://tobot-relay.sparklegremlinkindroid.workers.dev';
  function relayUrl(){
    try{ const u = (localStorage.getItem('tobot_relay_url') || '').trim(); if(u) return u; }catch(e){}
    return DEFAULT_RELAY;
  }
  // Hand-made badges that live in the repo's badges/ folder, shown first
  const FIXED_BADGES = [
    { id:'fixed-tophone', name:'Mindcore Pilot 1st Sync', desc:'', img:'badges/tophone.png', fixed:true }
  ];

  const grid = document.getElementById('grid');
  const stats = document.getElementById('stats');
  const empty = document.getElementById('empty');
  const note = document.getElementById('note');
  let current = null;

  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function render(badges, leftToday){
    const all = FIXED_BADGES.concat(badges || []);
    grid.innerHTML = '';
    all.forEach((b, i)=>{
      const d = document.createElement('div');
      d.className = 'badge';
      d.style.animationDelay = (i * 60) + 'ms';
      d.innerHTML = '<img alt="" src="' + esc(b.img) + '"><div class="bn">' + esc(b.name) + '</div>';
      d.addEventListener('click', ()=> openModal(b));
      grid.appendChild(d);
    });
    empty.style.display = (badges && badges.length) ? 'none' : 'block';
    stats.innerHTML = 'BADGES EARNED: <b>' + all.length + '</b>' +
      (typeof leftToday === 'number' ? ' &nbsp;|&nbsp; NEW PICTURES LEFT TODAY: <b>' + leftToday + '</b>' : '');
  }

  async function load(){
    render([], undefined);
    try{
      const resp = await fetch(relayUrl(), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ get_badges: true })
      });
      const data = await resp.json();
      if(!data.ok){
        note.textContent = data.error === 'not_configured'
          ? 'Badge storage is not set up yet. A grown-up needs to finish the Cloudflare setup.'
          : 'Could not load new badges right now.';
        return;
      }
      note.textContent = '';
      render(data.badges, data.left_today);
    }catch(e){
      note.textContent = 'Could not reach Tobot to load new badges. Showing saved ones only.';
    }
  }

  function openModal(b){
    current = b;
    document.getElementById('mImg').src = b.img;
    document.getElementById('mName').textContent = b.name;
    document.getElementById('mDesc').textContent = b.desc || '';
    document.getElementById('mDate').textContent = b.ts ? ('EARNED ' + new Date(b.ts).toLocaleDateString()) : '';
    document.getElementById('parentBox').style.display = b.fixed ? 'none' : 'block';
    document.getElementById('parentForm').style.display = 'none';
    document.getElementById('parentMsg').textContent = '';
    document.getElementById('passInput').value = '';
    document.getElementById('modal').classList.add('open');
  }
  function closeModal(){ document.getElementById('modal').classList.remove('open'); current = null; }
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', (e)=>{ if(e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });
  document.getElementById('parentToggle').addEventListener('click', ()=>{
    const f = document.getElementById('parentForm');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('delBtn').addEventListener('click', async ()=>{
    if(!current || current.fixed) return;
    const msg = document.getElementById('parentMsg');
    const pass = document.getElementById('passInput').value;
    if(!pass){ msg.textContent = 'Enter the parent passcode.'; return; }
    msg.textContent = 'Removing...';
    try{
      const resp = await fetch(relayUrl(), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ delete_badge: current.id, passcode: pass })
      });
      const data = await resp.json();
      if(data.ok){ closeModal(); load(); }
      else msg.textContent = data.error === 'wrong_passcode' ? 'Wrong passcode.' : 'Could not remove it.';
    }catch(e){ msg.textContent = 'Could not reach the server.'; }
  });

  load();
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });
</script>
